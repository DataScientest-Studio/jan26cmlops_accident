# ============================================================================
# Workflow CI : lint + tests sur chaque push/PR vers master
# ============================================================================
name: Python application

# Quand est-ce que ce workflow se declenche ?
on:
  push:
    branches: [ "master" ]        # A chaque push sur master
  pull_request:
    branches: [ "master" ]        # A chaque PR qui cible master

permissions:
  contents: read                  # Le workflow peut lire le code, c'est tout

jobs:
  build:
    runs-on: ubuntu-latest        # Machine virtuelle Linux (gratuite sur GitHub)

    steps:

    # Etape 1 : Telecharger le code du repo
    - uses: actions/checkout@v4   # v4 au lieu de v3 (v3 deprecated Node.js 20)

    # Etape 2 : Installer Python 3.11
    - name: Set up Python 3.11
      uses: actions/setup-python@v5   # v5 au lieu de v3
      with:
        python-version: "3.11"        # 3.11 au lieu de 3.10
                                      # (contourpy==1.3.3 exige >= 3.11)

    # Etape 3 : Installer les dependances
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov    # pytest-cov pour la couverture
        # Installer requirements.txt en excluant pywin32 (package Windows uniquement)
        grep -v pywin32 requirements.txt > requirements_ci.txt
        pip install -r requirements_ci.txt

    # Etape 4 : Verifier la syntaxe Python (erreurs graves uniquement)
    - name: Lint with flake8
      run: |
        # Stopper le build si erreur de syntaxe ou nom non defini
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Le reste = warnings (ne bloque pas le build)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Etape 5 : Lancer les tests avec couverture
    - name: Test with pytest
      run: |
        # -v : mode detaille (nom de chaque test)
        # --tb=short : tracebacks courts (plus lisible dans les logs CI)
        # --cov=src : mesurer la couverture du code dans src/
        # Rapport sauvegarde dans rapport_tests.txt pour archivage
        pytest tests/ -v --tb=short --cov=src --cov-report=term-missing | tee rapport_tests.txt

    # Etape 6 : Sauvegarder le rapport de test comme artefact telechargeable
    - name: Save test report
      if: always()    # meme si les tests echouent, on veut le rapport
      uses: actions/upload-artifact@v4
      with:
        name: rapport-tests
        path: rapport_tests.txt
