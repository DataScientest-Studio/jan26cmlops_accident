networks:
  mlops-net:
    driver: bridge

volumes:
  postgres-data:
  mlflow-data:

services:

  db:
    image: postgres:15
    container_name: accident-db
    environment:
      POSTGRES_DB: mlops_accidents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/data/database/create_table.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: accident-mlflow
    command: bash -c "pip install psycopg2-binary --quiet && mlflow server --host 0.0.0.0 --port 8080 --backend-store-uri postgresql://postgres:admin@db:5432/mlflow_tracking --default-artifact-root /mlflow/artifacts --serve-artifacts"
    ports:
      - "8080:8080"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - mlops-net
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accident-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    networks:
      - mlops-net
    restart: on-failure
